<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel = "stylesheet" href = "/main.css">
    <style>

        .ex {
            width: 20px;
            height: 150px;
            background-color: red;
            position: absolute;
            left: 0;
            top: 50%;
            border-radius: 10px;

            animation: anim 15s linear infinite;
        }

    
        @keyframes anim {

            0%{
              left:0;
              height: 150px;
              background-color: red;
            }

            12.5%{
                height: 50px;
            }
            25%{
                height: 150px;
                background-color: blue;
            }

            37.5%{
                height: 50px;
            }
            50%{
                height: 150px;
                background-color: red;
            }

            62.5%{
                height: 50px;
            }

            75%{
                height: 150px;
                background-color: blue;
            }

            87.5%{
                height: 50px;
            }
            100%{
             left: 100%;
             height: 150px;
             background-color: red;
            }
        }

    </style>
</head>
<body>
    <span class = "ex"></span>
    <span class = "ex" style="animation-delay: 0.6s;"></span>
    <span class = "ex" style="animation-delay: 1.2s;"></span>
    <span class = "ex" style="animation-delay: 1.8s;"></span>
    <span class = "ex" style="animation-delay: 2.4s;"></span>
    <span class = "ex" style="animation-delay: 3s;"></span>
    <span class = "ex" style="animation-delay: 3.6s;"></span>
    <span class = "ex" style="animation-delay: 4.2s;"></span>
    
</body>
</html>
